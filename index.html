<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏓Ping Pong🏓</title>
    <link href="./src/output.css" rel="stylesheet" />
    <script src="script.js" defer></script>
</head>

<body>
    <div id="topMenu" class="fixed top-2 inset-x-0 mx-auto w-fit flex gap-2 p-3">
        <div class="flex gap-2">
            <button id="p1-minus-score" onclick="p1MinusScore()"
                class="bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-5 rounded-2xl border-black border-2 shadow-2xl">
                -1
            </button>
            <button id="reset-button" onclick="resetGame()"
                class="bg-green-700 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-2xl border-black border-2 shadow-2xl">
                Reset
            </button>
            <button id="p2-minus-score" onclick="p2MinusScore()"
                class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-5 rounded-2xl border-black border-2 shadow-2xl">
                -1
            </button>
        </div>
    </div>
    <div class="flex h-svh gap-2 bg-black select-none" ondragstart="return false;" oncontextmenu="return false;">
        <button id="p1-button" onclick="p1ButtonPressed()"
            class="flex flex-1 min-w-0 justify-center items-center bg-red-700 hover:bg-red-600">
            <div id="p1-score" class="text-9xl font-bold shadow-xl shadow-black rounded-2xl p-3 border-white border-5">
                0
            </div>
        </button>

        <button id="p2-button" onclick="p2ButtonPressed()"
            class="flex flex-1 min-w-0 justify-center items-center bg-blue-700 hover:bg-blue-600">
            <div id="p2-score" class="text-9xl font-bold shadow-xl shadow-black rounded-2xl p-3 border-black border-3">
                0
            </div>
        </button>
    </div>
</body>

</html>
