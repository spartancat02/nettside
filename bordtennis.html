<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bordtennis score</title>
        <!-- This line connects your CSS stylesheet -->
        <link href="./src/output.css" rel="stylesheet" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <div
            class="flex h-svh gap-2 bg-black select-none"
            ondragstart="return false;"
            oncontextmenu="return false;"
        >
            <div
                id="p1-button"
                onclick="p1ButtonPressed()"
                class="flex justify-center items-center grow bg-red-700 hover:bg-red-600"
            >
                <button
                    id="p1-score"
                    class="text-9xl font-bold shadow-xl shadow-black rounded-2xl p-3 border-white border-5"
                >
                    0
                </button>
            </div>

            <div
                id="p2-button"
                onclick="p2ButtonPressed()"
                class="flex justify-center items-center grow bg-blue-700 hover:bg-blue-600"
            >
                <button
                    id="p2-score"
                    class="text-9xl font-bold shadow-xl shadow-black rounded-2xl p-3 border-black border-3"
                >
                    0
                </button>
            </div>
        </div>
    </body>
</html>
